<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The tab icon, and the README's header mark. The same bird as PerchMark, but filled and on
       its own tile rather than stroked bare: a browser tab and a GitHub page can each be light or
       dark behind it, and a filled tile is the only version that reads on both. The tile is the
       app's own two surface greys, card over background, with its hairline border, so the tab
       matches the window it opens. Colours are literal because this file is served as a
       standalone asset, with no stylesheet and no theme to inherit.

       Two notes for whoever edits this next. The bird is drawn in a 24x24 box and translated by 4
       to sit in the 32x32 tile, so its path data stays identical to PerchMark's and the two can
       be kept in step by eye. And XML comments cannot contain a double hyphen, so CSS custom
       properties are named in prose above rather than written out; a malformed comment does not
       warn, it silently stops the whole file rendering and the browser falls back to its default
       icon. -->
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="26" y1="6" x2="6" y2="26">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <rect x=".5" y=".5" width="31" height="31" rx="6.5" fill="none" stroke="#fff" stroke-opacity=".14"/>
  <g transform="translate(4 4)">
    <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 20h18"/>
      <path d="M11.4 17L11 20M14.6 17L14.2 20"/>
      <!-- The body outline, stroked, so the silhouette's outer edge is exactly PerchMark's. -->
      <path d="M20.5 8.2L18.3 7.2C17.8 5.3 15.5 4.4 14 5.6C13.2 6.2 12.4 6.5 11.6 7.2C10 8.6 9.6 10.85 7.9 12.2L3.95 15.3L5.55 17.35L9.3 14C10.3 15.6 13.8 18 16.2 15.6C17.6 14.2 18.4 12 18.3 10.5C18.2 9.6 18.4 9 18.6 8.9Z"/>
    </g>
    <!-- The same outline filled, with the eye knocked out by the even-odd rule. It is a separate
         element because stroking the filled path would paint the eye hole shut. -->
    <path fill="#fff" fill-rule="evenodd" d="M20.5 8.2L18.3 7.2C17.8 5.3 15.5 4.4 14 5.6C13.2 6.2 12.4 6.5 11.6 7.2C10 8.6 9.6 10.85 7.9 12.2L3.95 15.3L5.55 17.35L9.3 14C10.3 15.6 13.8 18 16.2 15.6C17.6 14.2 18.4 12 18.3 10.5C18.2 9.6 18.4 9 18.6 8.9ZM17.1 6.9a.7.7 0 1 0-1.4 0a.7.7 0 1 0 1.4 0Z"/>
  </g>
</svg>
