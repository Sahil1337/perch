<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;dominant-baseline:middle}.ui{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}.kw{fill:#5a9cf8}.num{fill:#e0a35e}.id{fill:#fafafa}.mut{fill:#8b8b8b}#typeclip rect{animation:type 9.0s steps(46,end) infinite}@keyframes type{0%,3.889%{width:0}27.222%,92.222%{width:372.6px}93.889%,100%{width:0}}.caret{animation:caret 9.0s steps(46,end) infinite,blink 1s steps(2,end) infinite}@keyframes caret{0%,3.889%{x:92px}27.222%,92.222%{x:464.6px}93.889%,100%{x:92px}}@keyframes blink{0%{opacity:1}50%{opacity:0}}.run{animation:run 9.0s infinite}@keyframes run{0%,28.556%{transform:scale(1);opacity:1}29.444%{transform:scale(.94);opacity:.85}31.444%,100%{transform:scale(1);opacity:1}}.skel{animation:skel 9.0s infinite}@keyframes skel{0%,31.556%{opacity:0}31.667%,36.111%{opacity:1}36.667%,100%{opacity:0}}.badge{animation:badge 9.0s cubic-bezier(.2,1.6,.4,1) infinite;transform-origin:center}@keyframes badge{0%,46.222%{opacity:0;transform:scale(.8)}49.444%,92.222%{opacity:1;transform:scale(1)}93.889%,100%{opacity:0;transform:scale(.8)}}.head{animation:head 9.0s infinite}@keyframes head{0%,36.0%{opacity:0}36.667%,92.222%{opacity:1}93.889%,100%{opacity:0}}.r0{animation:row0 9.0s cubic-bezier(.22,1,.36,1) infinite}@keyframes row0{0%,36.667%{opacity:0;transform:translateY(6px)}40.444%,92.222%{opacity:1;transform:translateY(0)}93.889%,100%{opacity:0;transform:translateY(6px)}}.r1{animation:row1 9.0s cubic-bezier(.22,1,.36,1) infinite}@keyframes row1{0%,37.667%{opacity:0;transform:translateY(6px)}41.444%,92.222%{opacity:1;transform:translateY(0)}93.889%,100%{opacity:0;transform:translateY(6px)}}.r2{animation:row2 9.0s cubic-bezier(.22,1,.36,1) infinite}@keyframes row2{0%,38.667%{opacity:0;transform:translateY(6px)}42.444%,92.222%{opacity:1;transform:translateY(0)}93.889%,100%{opacity:0;transform:translateY(6px)}}.r3{animation:row3 9.0s cubic-bezier(.22,1,.36,1) infinite}@keyframes