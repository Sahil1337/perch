name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a draft release from (e.g. v0.1.0)"
        required: true

env:
  GO_VERSION: "1.25"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # `gh release create --generate-notes` needs the history to diff against the last tag.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve the version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          # The binary reports its version from a build flag, so a tag that disagrees with
          # package.json would ship a binary that lies about which release it is.
          DECLARED=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' apps/server/package.json | head -1)
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::tag $TAG says $VERSION but apps/server/package.json says $DECLARED"
            exit 1
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The binary embeds the UI at compile time, so the web build has to happen first.
      - run: bun install --frozen-lockfile
      - run: bun run --filter @perch/web build

      - name: Build every target
        working-directory: apps/server
        env:
          PERCH_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build.sh --all

      - name: Package
        id: package
        working-directory: apps/server
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          for path in dist/perch-*; do
            base=$(basename "$path")
            target=${base#perch-}; target=${target%.exe}

            # Windows ships the bare .exe: it is runnable straight from the download, and
            # Windows has no executable bit to lose.
            if [ "${base##*.}" = "exe" ]; then
              cp "$path" "release/perch-$VERSION-$target.exe"
              continue
            fi

            # Everything else is a tarball, which is what carries the executable bit — a raw
            # download arrives without it and needs a chmod before it will run. The binary goes
            # in under its plain name, because what lands on PATH should be `perch`.
            stage=$(mktemp -d)
            cp "$path" "$stage/perch"
            chmod +x "$stage/perch"
            cp LICENSE README.md "$stage/"
            tar -czf "release/perch-$VERSION-$target.tar.gz" -C "$stage" .
            rm -rf "$stage"
          done
          (cd release && sha256sum perch-* > checksums.txt)
          ls -lh release

      # Note: these binaries are unsigned. macOS quarantines a downloaded copy and Gatekeeper
      # refuses it without notarization; Windows shows a SmartScreen warning. Both need paid
      # certificates, so the draft says so until they exist.
      - name: Draft the release
        working-directory: apps/server
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --draft \
              --title "perch $TAG" \
              --generate-notes
          fi
