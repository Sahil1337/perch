name: launcher

on:
  push:
    branches: [main]
    paths:
      - "apps/launcher/**"
      - "apps/server/**"
      - ".github/workflows/launcher.yml"
  pull_request:
    paths:
      - "apps/launcher/**"
      - "apps/server/**"
      - ".github/workflows/launcher.yml"
  workflow_dispatch:

env:
  GO_VERSION: "1.25"

jobs:
  # The installer, the launcher window and `perch stop` only meet on Windows, and no Windows
  # machine is in the dev loop, so this is the one place they run together.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/*/go.sum
      # drive-window.mjs speaks CDP over Node's global WebSocket.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No UI is embedded, as in server.yml's cli job. build.sh names a host build plain
      # dist/perch; the installer looks for the release name.
      - name: Build perch
        shell: bash
        working-directory: apps/server
        run: bash scripts/build.sh && cp dist/perch dist/perch-windows-amd64.exe
      - name: Build the launcher
        shell: bash
        run: bash apps/launcher/scripts/build.sh
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\NSIS"
      - name: Build the installer
        shell: bash
        run: bash apps/launcher/scripts/installer.sh

      # The checks live in check-install.ps1 so the same run works on any Windows PC.
      - name: Install silently, then serve and stop
        shell: pwsh
        env:
          PERCH_HOME: ${{ runner.temp }}\perch-home
        run: apps/launcher/scripts/check-install.ps1 -Setup (Get-Item apps/launcher/dist/perch-*-windows-amd64-setup.exe).FullName -Step install

      - name: Drive the launcher window
        shell: pwsh
        env:
          PERCH_HOME: ${{ runner.temp }}\perch-home
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Perch'
          node apps/launcher/scripts/drive-window.mjs "$dir\PerchLauncher.exe" "$dir\perch.exe" "$env:RUNNER_TEMP\launcher-window"

      - name: Reinstall over a running server, then uninstall
        if: success() || failure()
        shell: pwsh
        env:
          PERCH_HOME: ${{ runner.temp }}\perch-home
        run: apps/launcher/scripts/check-install.ps1 -Setup (Get-Item apps/launcher/dist/perch-*-windows-amd64-setup.exe).FullName -Step uninstall

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-window
          path: ${{ runner.temp }}/launcher-window
          if-no-files-found: warn
